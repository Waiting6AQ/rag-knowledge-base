# RAG 知识库问答系统 - 容器化编排
# 启动：docker compose up -d --build
# 配置：同目录 .env（DB_PASSWORD、PG_PASSWORD、DASHSCOPE_API_KEY）
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      MYSQL_DATABASE: rag_admin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 引擎的会话状态（LangGraph checkpoint）与对话元数据
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${PG_USER:-engine}
      # ⚠️ 密码含 @ : / 等特殊字符时需 URL 编码，否则 DSN 解析会出错
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 设置 PG_PASSWORD}
      POSTGRES_DB: rag_engine
      TZ: Asia/Shanghai
    volumes:
      # postgres:18+ 的数据目录是 /var/lib/postgresql/18/docker，卷要挂在父目录；
      # 挂在 .../data 会被镜像判定为"挂错位置的卷"而拒绝启动
      - pg-data:/var/lib/postgresql
    healthcheck:
      # $$ 是 compose 转义：留给容器内 shell 展开，避免 compose 在解析期插值
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s   # 首次 initdb 要时间，别算进 retries
    # 不映射宿主端口：内网服务，只有 engine 访问（也避免两个项目抢 5432）

  # 向量存储：文档 chunk 的 dense + sparse 向量
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # 镜像里没有 curl/wget，用 bash 的 /dev/tcp 探 6333 端口
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # 不映射宿主端口：内网服务，只有 engine 访问（也避免两个项目抢 6333）

  engine:
    build: ./rag_engine
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 .env 设置 DASHSCOPE_API_KEY}
      # 模型名透传：换模型只改根目录 .env（不用重建镜像）；未设置时用默认值
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-openai:qwen3.8-2.4t-a95b}
      # 会话状态 + 对话元数据都在 PG（容器内没有 localhost，走服务名 postgres）
      POSTGRES_DSN: postgresql://${PG_USER:-engine}:${PG_PASSWORD:?}@postgres:5432/rag_engine
      # 向量库（容器内没有 localhost，走服务名 qdrant）
      QDRANT_URL: http://qdrant:6333
    # 数据卷：只剩上传文档与向量库（checkpoint 和元数据已迁到 PostgreSQL）；
    # reranker 模型缓存避免容器重建后重下 1.3GB
    volumes:
      - engine-data:/app/data
      - engine-cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # 不暴露端口：内网服务，只有 backend 能访问（"Python 不出内网"在部署层落地）
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?}
      # 容器内没有 localhost：JDBC 走服务名 mysql（本地开发默认 localhost）
      DB_URL: jdbc:mysql://mysql:3306/rag_admin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET:-rag-admin-jwt-secret-key-change-me-in-production-2026}   # ≥32 字符，否则 jjwt 拒绝启动
      # 容器内用服务名通信（本地开发是 localhost）
      AI_SERVICE_URL: http://engine:8000
    depends_on:
      mysql:
        condition: service_healthy
      engine:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  engine-data:
  engine-cache:
  pg-data:
  qdrant-data:
